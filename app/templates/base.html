<!doctype html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UBCC 2026 Orientation Camp</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Font 字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background: #f0f2f5;
            padding-top: 70px;
        }
        /* 导航栏：深色渐变 + 毛玻璃 */
        .navbar-custom {
            background: linear-gradient(135deg, #0b1120 0%, #1a2332 100%);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
            padding: 12px 0;
            border-bottom: 2px solid #d4af37;
        }
        .navbar-custom .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
            color: #fff !important;
        }
        .navbar-custom .navbar-brand span {
            color: #d4af37;
        }
        .navbar-custom .nav-link {
            color: rgba(255,255,255,0.7) !important;
            font-weight: 500;
            transition: 0.3s;
            margin: 0 8px;
        }
        .navbar-custom .nav-link:hover {
            color: #d4af37 !important;
            transform: translateY(-1px);
        }
        /* 卡片悬浮效果 */
        .card-hover {
            transition: all 0.3s ease;
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .card-hover:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
        }
        /* 页脚 */
        .footer-custom {
            background: linear-gradient(135deg, #0b1120 0%, #1a2332 100%);
            color: rgba(255,255,255,0.5);
            padding: 30px 0;
            margin-top: 60px;
            border-top: 1px solid rgba(212,175,55,0.3);
        }
        .footer-custom a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
        }
        .footer-custom a:hover {
            color: #d4af37;
        }
        /* 金色点缀 */
        .gold-text {
            color: #d4af37;
        }
        .bg-gold {
            background-color: #d4af37;
        }
        .btn-gold {
            background: #d4af37;
            color: #0b1120;
            font-weight: 700;
            padding: 10px 32px;
            border-radius: 50px;
            transition: 0.3s;
            border: none;
        }
        .btn-gold:hover {
            background: #e8c84a;
            color: #0b1120;
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(212,175,55,0.4);
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">
                UBCC <span>2026</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('main.camp') }}">
                            <i class="fas fa-calendar-alt me-1"></i>日程表
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 页面内容 -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="footer-custom text-center">
        <div class="container">
            <p class="mb-0">
                <i class="fas fa-crown gold-text me-2"></i>
                © 2026 University Business Consulting Club
                <i class="fas fa-crown gold-text ms-2"></i>
            </p>
            <small>Built with <i class="fas fa-heart" style="color: #d4af37;"></i> for UBCC 2026 OCAMP</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
