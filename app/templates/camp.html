{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">📅 日程表</h2>

<!-- 按天显示 -->
<ul class="nav nav-tabs" id="dayTab" role="tablist">
    {% for day, items in days.items() %}
    <li class="nav-item" role="presentation">
        <button class="nav-link {% if loop.first %}active{% endif %}"
                id="tab-{{ loop.index }}"
                data-bs-toggle="tab"
                data-bs-target="#day-{{ loop.index }}"
                type="button" role="tab">
            {{ day }}
        </button>
    </li>
    {% endfor %}
</ul>

<div class="tab-content mt-3">
    {% for day, items in days.items() %}
    <div class="tab-pane fade {% if loop.first %}show active{% endif %}"
         id="day-{{ loop.index }}" role="tabpanel">
        <div class="list-group">
            {% for act in items %}
            <a href="{{ url_for('main.activity_detail', id=act.id) }}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                <div>
                    <span class="badge bg-secondary me-2">{{ act.time }}</span>
                    <span class="badge bg-{{ 'danger' if act.room_need == 'red' else 'success' if act.room_need == 'green' else 'secondary' }}">
                        {{ act.period }}
                    </span>
                    {{ act.title }}
                </div>
                <span class="badge bg-primary rounded-pill">詳情 →</span>
            </a>
            {% endfor %}
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
