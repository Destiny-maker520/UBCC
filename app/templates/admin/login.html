<!doctype html>
<html lang="zh-HK">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UBCC 后台管理 · 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ubcc-orange: #F5A623;
            --ubcc-dark: #1a1a2e;
        }
        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            transition: 0.3s;
        }
        .login-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 100px rgba(245,166,35,0.15);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-logo i {
            font-size: 3.5rem;
            color: var(--ubcc-orange);
            background: rgba(245,166,35,0.1);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 15px;
        }
        .login-logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--ubcc-dark);
            letter-spacing: -0.5px;
        }
        .login-logo h1 span {
            color: var(--ubcc-orange);
        }
        .login-logo p {
            color: #888;
            font-size: 0.9rem;
            margin-top: 5px;
        }
        .form-control {
            border-radius: 16px;
            padding: 14px 20px;
            border: 2px solid #e8ecf1;
            background: #f8fafc;
            font-size: 0.95rem;
            transition: 0.3s;
        }
        .form-control:focus {
            border-color: var(--ubcc-orange);
            box-shadow: 0 0 0 4px rgba(245,166,35,0.15);
            background: #fff;
        }
        .input-group-text {
            background: #f8fafc;
            border: 2px solid #e8ecf1;
            border-right: none;
            border-radius: 16px 0 0 16px;
            color: #888;
        }
        .form-control {
            border-radius: 0 16px 16px 0;
            border-left: none;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .btn-login {
            background: var(--ubcc-orange);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 14px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background: #e09515;
            transform: scale(1.02);
            box-shadow: 0 8px 30px rgba(245,166,35,0.4);
            color: #fff;
        }
        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            font-size: 0.8rem;
        }
        .alert-error {
            border-radius: 16px;
            background: #fee2e2;
            border: none;
            color: #b91c1c;
            padding: 12px 18px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
        }
        .alert-error.show {
            display: block;
        }
        .password-toggle {
            cursor: pointer;
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            z-index: 10;
        }
        .password-toggle:hover {
            color: var(--ubcc-orange);
        }
        .input-group.position-relative .form-control {
            padding-right: 50px;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-logo">
        <i class="fas fa-shield-alt"></i>
        <h1>UBCC <span>后台</span></h1>
        <p>University Business Consulting Club</p>
    </div>

    <!-- 错误提示 -->
    <div id="errorAlert" class="alert-error">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span id="errorMessage">用户名或密码错误，请重试。</span>
    </div>

    <!-- 登录表单 -->
    <form id="loginForm" method="POST" action="{{ url_for('main.admin_login') }}">
        <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input type="text" class="form-control" id="username" name="username" placeholder="用户名" value="admin" required>
        </div>

        <div class="input-group position-relative">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password" placeholder="密码" required>
            <span class="password-toggle" onclick="togglePassword()">
                <i class="fas fa-eye" id="eyeIcon"></i>
            </span>
        </div>

        <button type="submit" class="btn-login">
            <i class="fas fa-arrow-right-to-bracket me-2"></i>登 录
        </button>
    </form>

    <div class="login-footer">
        <p>© 2026 UBCC · 仅供内部管理使用</p>
    </div>
</div>

<script>
    // ===== 显示错误信息（由后端传入） =====
    {% if error %}
    document.addEventListener('DOMContentLoaded', function() {
        var alert = document.getElementById('errorAlert');
        var msg = document.getElementById('errorMessage');
        msg.textContent = '{{ error }}';
        alert.classList.add('show');
    });
    {% endif %}

    // ===== 密码显示/隐藏 =====
    function togglePassword() {
        var input = document.getElementById('password');
        var icon = document.getElementById('eyeIcon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'fas fa-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'fas fa-eye';
        }
    }
</script>

</body>
</html>
